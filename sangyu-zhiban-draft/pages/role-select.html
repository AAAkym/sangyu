<html lang="zh-CN" class="light">

    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 暖琥珀适老化设计令牌 (DRAFT)
   Brand: Warm Honey Amber (暖琥珀色) · Soft Ivory (柔象牙白)
   色调从深红枫叶转为偏黄暖琥珀，更明亮温暖
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Warm Honey Amber (暖琥珀/蜂蜜金) ---- */
  --sangyu-primary: #B5832E;
  --sangyu-primary-50: #FBF5EC;
  --sangyu-primary-100: #F5E6CC;
  --sangyu-primary-200: #E8CC99;
  --sangyu-primary-300: #D4B366;
  --sangyu-primary-400: #C49A3D;
  --sangyu-primary-500: #B5832E;
  --sangyu-primary-600: #9A6E25;
  --sangyu-primary-700: #7A561D;
  --sangyu-primary-800: #5C4116;
  --sangyu-primary-900: #3D2B0F;

  /* ---- Neutral Warm Scale (暖中性色, 琥珀底调) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FFF9F0;
  --sangyu-neutral-100: #F5EFE2;
  --sangyu-neutral-200: #E8DDC8;
  --sangyu-neutral-300: #D5C5A8;
  --sangyu-neutral-400: #B8A580;
  --sangyu-neutral-500: #8A7A5C;
  --sangyu-neutral-600: #6B5D44;
  --sangyu-neutral-700: #4A3F2E;
  --sangyu-neutral-800: #2A2316;
  --sangyu-neutral-900: #1A150F;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #C49A3D;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 柔象牙白基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FFF9F0;
  --sangyu-foreground: #2A2316;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A2316;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A2316;
  --sangyu-primary-foreground: #FFF9F0;
  --sangyu-muted: #F5EFE2;
  --sangyu-muted-foreground: #6B5D44;
  --sangyu-border: #E8DDC8;
  --sangyu-input: #F5EFE2;
  --sangyu-ring: #B5832E;

  /* Non-prefixed semantic aliases */
  --background: #FFF9F0;
  --foreground: #2A2316;
  --card: #FFFFFF;
  --card-foreground: #2A2316;
  --popover: #FFFFFF;
  --popover-foreground: #2A2316;
  --primary: #B5832E;
  --primary-foreground: #FFF9F0;
  --muted: #F5EFE2;
  --muted-foreground: #6B5D44;
  --border: #E8DDC8;
  --input: #F5EFE2;
  --ring: #B5832E;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度, 琥珀底调 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 43, 15, 0.05), 0 1px 1px rgba(61, 43, 15, 0.03);
  --sangyu-shadow-2: 0 4px 16px -4px rgba(61, 43, 15, 0.10), 0 2px 4px -2px rgba(61, 43, 15, 0.06);
  --sangyu-shadow-3: 0 16px 48px -16px rgba(61, 43, 15, 0.18);
  --shadow-1: 0 1px 2px rgba(61, 43, 15, 0.05), 0 1px 1px rgba(61, 43, 15, 0.03);
  --shadow-2: 0 4px 16px -4px rgba(61, 43, 15, 0.10), 0 2px 4px -2px rgba(61, 43, 15, 0.06);
  --shadow-3: 0 16px 48px -16px rgba(61, 43, 15, 0.18);
}

/* ============================================================
   Dark Mode — 深琥珀棕基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #2A2316;
  --sangyu-foreground: #FFF9F0;
  --sangyu-card: #3D2B0F;
  --sangyu-card-foreground: #FFF9F0;
  --sangyu-popover: #3D2B0F;
  --sangyu-popover-foreground: #FFF9F0;
  --sangyu-primary: #D4B366;
  --sangyu-primary-foreground: #2A2316;
  --sangyu-muted: #4A3F2E;
  --sangyu-muted-foreground: #D5C5A8;
  --sangyu-border: #5C4116;
  --sangyu-input: #4A3F2E;
  --sangyu-ring: #D4B366;

  --background: #2A2316;
  --foreground: #FFF9F0;
  --card: #3D2B0F;
  --card-foreground: #FFF9F0;
  --popover: #3D2B0F;
  --popover-foreground: #FFF9F0;
  --primary: #D4B366;
  --primary-foreground: #2A2316;
  --muted: #4A3F2E;
  --muted-foreground: #D5C5A8;
  --border: #5C4116;
  --input: #4A3F2E;
  --ring: #D4B366;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

    </style>

    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);

  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
      /* ===== Critical Layout CSS — static-first, brand-amber entity surfaces =====
         No gradients. Brand amber is the page identity, not decoration.
         Role surfaces rely on clear warm borders, not floating shadows.
         Font sizes use rem so the page honours system font scaling. ===== */
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--primary);
      }
      body {
        color: var(--primary-foreground);
        -webkit-font-smoothing: antialiased;
      }

      .role-select-page {
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background-color: var(--primary);
        display: flex;
        flex-direction: column;
        padding: 3.5rem 1.5rem 2rem;
        box-sizing: border-box;
      }
      .role-select-page * { box-sizing: border-box; }

      /* ---- Brand header ---- */
      .brand-area {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 3rem;
      }
      .brand-mark {
        width: 4rem;
        height: 4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-foreground);
        margin-bottom: 1rem;
      }
      .brand-mark svg { width: 100%; height: 100%; }
      .brand-name {
        font-size: 2.125rem; /* 34px — hierarchy by size */
        font-weight: 700;
        color: var(--primary-foreground);
        letter-spacing: 0.06em;
        line-height: 1.15;
        margin: 0 0 0.5rem;
      }
      .brand-tagline {
        font-size: 1.125rem; /* 18px body */
        font-weight: 400;
        color: var(--primary-foreground);
        opacity: 0.82;
        margin: 0;
        letter-spacing: 0.04em;
      }

      /* ---- Role cards: bordered entity surfaces, no floating shadow ---- */
      .role-cards {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
      }
      .role-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 1.125rem;
        background-color: var(--card);
        border: 2px solid var(--sangyu-primary-200);
        border-radius: var(--radius-lg);
        padding: 1.5rem 1.25rem;
        min-height: 6rem; /* 96px — exceeds 48dp touch target */
        text-decoration: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
      }
      .role-card:active {
        border-color: var(--primary);
        background-color: var(--sangyu-primary-50);
        transform: scale(0.985);
      }
      .role-card:focus-visible {
        outline: 3px solid var(--primary-foreground);
        outline-offset: 2px;
      }
      .role-icon {
        flex-shrink: 0;
        width: 2.5rem;
        height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
      }
      .role-icon svg { width: 2.25rem; height: 2.25rem; }
      .role-card-body {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        flex: 1;
        min-width: 0;
      }
      .role-card-title {
        font-size: 1.5rem; /* 24px */
        font-weight: 700;
        line-height: 1.25;
        color: var(--foreground);
      }
      .role-card-desc {
        font-size: 1.125rem; /* 18px body */
        line-height: 1.5;
        color: var(--muted-foreground);
      }
      .role-card-cta {
        flex-shrink: 0;
        width: 1.5rem;
        height: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sangyu-primary-400);
      }
      .role-card-cta svg { width: 1.5rem; height: 1.5rem; }

      /* ---- Skip (choose later) ---- */
      .skip-link {
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        border: none;
        color: var(--primary-foreground);
        opacity: 0.82;
        font-size: 1.0625rem;
        font-family: inherit;
        text-align: center;
        min-height: 3rem;
        padding: 0.75rem 1rem;
        margin: 1.75rem 0 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        text-decoration: underline;
        text-underline-offset: 5px;
        text-decoration-color: color-mix(in srgb, var(--primary-foreground) 45%, transparent);
      }
      .skip-link:active { opacity: 1; }

      /* ---- Footer ---- */
      .footer-area {
        margin-top: auto;
        padding-top: 1.5rem;
        text-align: center;
      }
      .footer-links {
        font-size: 0.9375rem; /* 15px */
        line-height: 1.6;
        color: var(--primary-foreground);
        opacity: 0.72;
        margin: 0;
      }
      .footer-links a {
        display: inline-block;
        color: var(--primary-foreground);
        padding: 0.25rem 0.25rem;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .footer-links a:active { opacity: 1; }

      @media (prefers-reduced-motion: reduce) {
        .role-card { transition: none; }
        .role-card:active { transform: none; }
      }
    </style>

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>

          </span>
          <span class="role-card-cta" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <button id="skip-role" type="button" class="skip-link">稍后再选</button>

      <footer id="footer-area" class="footer-area">
        <p id="privacy-links" class="footer-links">
          选择身份即表示同意 <a href="#">隐私政策</a> 与 <a href="#">用户协议</a>
        </p>
      </footer>
    </main>

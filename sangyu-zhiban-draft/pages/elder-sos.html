    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 暖琥珀适老化设计令牌 (DRAFT)
   Brand: Warm Honey Amber (暖琥珀色) · Soft Ivory (柔象牙白)
   色调从深红枫叶转为偏黄暖琥珀，更明亮温暖
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Warm Honey Amber (暖琥珀/蜂蜜金) ---- */
  --sangyu-primary: #B5832E;
  --sangyu-primary-50: #FBF5EC;
  --sangyu-primary-100: #F5E6CC;
  --sangyu-primary-200: #E8CC99;
  --sangyu-primary-300: #D4B366;
  --sangyu-primary-400: #C49A3D;
  --sangyu-primary-500: #B5832E;
  --sangyu-primary-600: #9A6E25;
  --sangyu-primary-700: #7A561D;
  --sangyu-primary-800: #5C4116;
  --sangyu-primary-900: #3D2B0F;

  /* ---- Neutral Warm Scale (暖中性色, 琥珀底调) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FFF9F0;
  --sangyu-neutral-100: #F5EFE2;
  --sangyu-neutral-200: #E8DDC8;
  --sangyu-neutral-300: #D5C5A8;
  --sangyu-neutral-400: #B8A580;
  --sangyu-neutral-500: #8A7A5C;
  --sangyu-neutral-600: #6B5D44;
  --sangyu-neutral-700: #4A3F2E;
  --sangyu-neutral-800: #2A2316;
  --sangyu-neutral-900: #1A150F;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #C49A3D;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 柔象牙白基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FFF9F0;
  --sangyu-foreground: #2A2316;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A2316;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A2316;
  --sangyu-primary-foreground: #FFF9F0;
  --sangyu-muted: #F5EFE2;
  --sangyu-muted-foreground: #6B5D44;
  --sangyu-border: #E8DDC8;
  --sangyu-input: #F5EFE2;
  --sangyu-ring: #B5832E;

  /* Non-prefixed semantic aliases */
  --background: #FFF9F0;
  --foreground: #2A2316;
  --card: #FFFFFF;
  --card-foreground: #2A2316;
  --popover: #FFFFFF;
  --popover-foreground: #2A2316;
  --primary: #B5832E;
  --primary-foreground: #FFF9F0;
  --muted: #F5EFE2;
  --muted-foreground: #6B5D44;
  --border: #E8DDC8;
  --input: #F5EFE2;
  --ring: #B5832E;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度, 琥珀底调 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 43, 15, 0.05), 0 1px 1px rgba(61, 43, 15, 0.03);
  --sangyu-shadow-2: 0 4px 16px -4px rgba(61, 43, 15, 0.10), 0 2px 4px -2px rgba(61, 43, 15, 0.06);
  --sangyu-shadow-3: 0 16px 48px -16px rgba(61, 43, 15, 0.18);
  --shadow-1: 0 1px 2px rgba(61, 43, 15, 0.05), 0 1px 1px rgba(61, 43, 15, 0.03);
  --shadow-2: 0 4px 16px -4px rgba(61, 43, 15, 0.10), 0 2px 4px -2px rgba(61, 43, 15, 0.06);
  --shadow-3: 0 16px 48px -16px rgba(61, 43, 15, 0.18);
}

/* ============================================================
   Dark Mode — 深琥珀棕基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #2A2316;
  --sangyu-foreground: #FFF9F0;
  --sangyu-card: #3D2B0F;
  --sangyu-card-foreground: #FFF9F0;
  --sangyu-popover: #3D2B0F;
  --sangyu-popover-foreground: #FFF9F0;
  --sangyu-primary: #D4B366;
  --sangyu-primary-foreground: #2A2316;
  --sangyu-muted: #4A3F2E;
  --sangyu-muted-foreground: #D5C5A8;
  --sangyu-border: #5C4116;
  --sangyu-input: #4A3F2E;
  --sangyu-ring: #D4B366;

  --background: #2A2316;
  --foreground: #FFF9F0;
  --card: #3D2B0F;
  --card-foreground: #FFF9F0;
  --popover: #3D2B0F;
  --popover-foreground: #FFF9F0;
  --primary: #D4B366;
  --primary-foreground: #2A2316;
  --muted: #4A3F2E;
  --muted-foreground: #D5C5A8;
  --border: #5C4116;
  --input: #4A3F2E;
  --ring: #D4B366;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

<body class="min-h-screen font-sans antialiased">
    <main class="sos-page" id="sosPage">
        <style id="critical-layout">
          /* ============================================================
             critical layout — 桑榆智伴 紧急求助
             Visual north star: a calm, confident emergency tool.
             Solid colors + borders + box-shadows for entity feel.
             No gradients. Renders without Tailwind runtime.
             ============================================================ */

          body { margin: 0; }

          .sos-page {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--background);
            color: var(--foreground);
            display: flex;
            flex-direction: column;
            padding-bottom: calc(72px + env(safe-area-inset-bottom));
            position: relative;
          }

          /* ---- Top app bar ---- */
          .sos-appbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background-color: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            padding-top: calc(10px + env(safe-area-inset-top));
          }
          .sos-appbar-inner {
            display: flex;
            align-items: center;
            gap: 10px;
          }
          .sos-back {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background-color: var(--card);
            color: var(--foreground);
            cursor: pointer;
            flex-shrink: 0;
          }
          .sos-appbar-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--foreground);
            letter-spacing: 0.01em;
          }
          .sos-device-pill {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted-foreground);
            padding: 6px 12px;
            border-radius: var(--radius-full);
            background-color: var(--muted);
          }
          .sos-device-dot {
            width: 8px;
            height: 8px;
            border-radius: var(--radius-full);
            background-color: var(--state-success);
            box-shadow: 0 0 0 3px rgba(45, 122, 61, 0.16);
            flex-shrink: 0;
          }

          /* ---- Location opt-in strip ---- */
          .sos-loc-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px 4px;
            font-size: 14px;
            color: var(--muted-foreground);
            text-align: center;
          }
          .sos-loc-strip svg { color: var(--state-success); flex-shrink: 0; }

          /* ---- Main SOS zone — dominated by negative space ---- */
          .sos-main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 24px 20px 8px;
          }
          .sos-headline { text-align: center; }
          .sos-headline h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--foreground);
            line-height: 1.25;
            margin: 0;
          }
          .sos-headline p {
            font-size: 16px;
            color: var(--muted-foreground);
            margin: 6px 0 0;
          }

          /* The physical SOS call button */
          .sos-button-wrap {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          .sos-button {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: var(--radius-full);
            background-color: var(--state-error);
            border: 6px solid color-mix(in srgb, var(--state-error) 75%, black);
            color: var(--card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            box-shadow:
              inset 0 6px 14px rgba(255, 255, 255, 0.22),
              inset 0 -10px 18px rgba(0, 0, 0, 0.28),
              0 14px 30px -10px rgba(198, 40, 40, 0.55);
            transition: transform 0.08s ease, box-shadow 0.12s ease, background-color 0.2s ease, border-color 0.2s ease;
            animation: sos-pulse 2.4s ease-out infinite;
          }
          .sos-button:active,
          .sos-button.is-pressed {
            transform: translateY(3px);
            box-shadow:
              inset 0 4px 10px rgba(255, 255, 255, 0.18),
              inset 0 -6px 12px rgba(0, 0, 0, 0.3),
              0 6px 14px -8px rgba(198, 40, 40, 0.5);
          }
          .sos-button .ico { width: 40px; height: 40px; }
          .sos-button .sos-btn-word {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.06em;
            line-height: 1;
          }
          .sos-button .sos-btn-sub {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.92;
            letter-spacing: 0.04em;
          }
          .sos-button .sos-btn-sent {
            display: none;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.04em;
          }

          /* long-press progress ring overlay */
          .sos-progress {
            position: absolute;
            inset: -16px;
            pointer-events: none;
          }
          .sos-progress circle {
            fill: none;
            stroke: var(--state-error);
            stroke-width: 5;
            stroke-linecap: round;
            opacity: 0;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
          }
          .sos-button-wrap.is-holding .sos-button { animation: none; }
          .sos-button-wrap.is-holding .sos-progress circle {
            opacity: 0.85;
            animation: sos-ring 2s linear forwards;
          }
          @keyframes sos-ring {
            from { stroke-dashoffset: 653; }
            to   { stroke-dashoffset: 0; }
          }

          /* confirmed (sent) state — green = safe/confirmed */
          .sos-page.is-confirmed .sos-button {
            background-color: var(--state-success);
            border-color: color-mix(in srgb, var(--state-success) 70%, black);
            animation: none;
            box-shadow:
              inset 0 6px 14px rgba(255, 255, 255, 0.2),
              inset 0 -10px 18px rgba(0, 0, 0, 0.22),
              0 14px 30px -10px rgba(45, 122, 61, 0.5);
          }
          .sos-page.is-confirmed .sos-button .sos-btn-icon,
          .sos-page.is-confirmed .sos-button .sos-btn-word,
          .sos-page.is-confirmed .sos-button .sos-btn-sub { display: none; }
          .sos-page.is-confirmed .sos-button .sos-btn-sent { display: block; }
          .sos-page.is-confirmed .sos-hint-ready { display: none; }
          .sos-page:not(.is-confirmed) .sos-success { display: none; }

          /* pulse — expanding ring via box-shadow (NOT gradient) */
          @keyframes sos-pulse {
            0%   { box-shadow: inset 0 6px 14px rgba(255,255,255,0.22), inset 0 -10px 18px rgba(0,0,0,0.28), 0 14px 30px -10px rgba(198,40,40,0.55), 0 0 0 0 rgba(198,40,40,0.42); }
            70%  { box-shadow: inset 0 6px 14px rgba(255,255,255,0.22), inset 0 -10px 18px rgba(0,0,0,0.28), 0 14px 30px -10px rgba(198,40,40,0.55), 0 0 0 24px rgba(198,40,40,0); }
            100% { box-shadow: inset 0 6px 14px rgba(255,255,255,0.22), inset 0 -10px 18px rgba(0,0,0,0.28), 0 14px 30px -10px rgba(198,40,40,0.55), 0 0 0 0 rgba(198,40,40,0); }
          }
          @media (prefers-reduced-motion: reduce) {
            .sos-button { animation: none; }
            .sos-button-wrap.is-holding .sos-progress circle { animation: none; opacity: 0; }
          }

          .sos-hint {
            font-size: 15px;
            color: var(--muted-foreground);
            text-align: center;
            margin: 0;
          }
          .sos-hint strong { color: var(--foreground); font-weight: 700; }

          /* ---- Success card (green semantic) ---- */
          .sos-success { padding: 0 20px; width: 100%; box-sizing: border-box; }
          .sos-success-card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-left: 5px solid var(--state-success);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
          }
          .sos-success-card .check { color: var(--state-success); flex-shrink: 0; margin-top: 1px; }
          .sos-success-card .body { flex: 1; min-width: 0; }
          .sos-success-card h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--foreground);
            line-height: 1.3;
            margin: 0;
          }
          .sos-success-card .meta {
            font-size: 14px;
            color: var(--muted-foreground);
            margin: 6px 0 0;
            display: flex;
            align-items: center;
            gap: 6px;
          }
          .sos-success-card .meta svg { color: var(--state-success); flex-shrink: 0; }
          .sos-cancel-btn {
            margin-top: 12px;
            width: 100%;
            min-height: 48px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            background-color: var(--card);
            color: var(--muted-foreground);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
          }
          .sos-cancel-btn:active { transform: translateY(1px); }

          /* ---- Other contact options ---- */
          .sos-options {
            padding: 26px 20px 8px;
            width: 100%;
            box-sizing: border-box;
          }
          .sos-options-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--muted-foreground);
            margin: 0 0 12px;
            letter-spacing: 0.04em;
          }
          .sos-options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
          }
          .sos-option {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 68px;
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--border);
            background-color: var(--card);
            color: var(--foreground);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: transform 0.08s ease, background-color 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
          }
          .sos-option:active { transform: translateY(1px); }
          .sos-option .ico {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            color: var(--primary-700);
          }
          .sos-option .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
          .sos-option .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--foreground);
            line-height: 1.25;
          }
          .sos-option .desc {
            font-size: 14px;
            font-weight: 400;
            color: var(--muted-foreground);
            line-height: 1.3;
          }
          .sos-option .chev {
            color: var(--muted-foreground);
            flex-shrink: 0;
            width: 20px;
            height: 20px;
          }

          /* semantic variants — color carries meaning, not decoration */
          .sos-option--family {
            background-color: var(--primary);
            border-color: var(--primary);
          }
          .sos-option--family .name { color: var(--primary-foreground); }
          .sos-option--family .desc { color: rgba(255, 249, 240, 0.85); }
          .sos-option--family .ico { color: var(--primary-foreground); }
          .sos-option--family .chev { color: var(--primary-foreground); }

          .sos-option--community .ico { color: var(--primary-700); }

          .sos-option--er { border-color: var(--state-error); }
          .sos-option--er .name { color: var(--state-error); }
          .sos-option--er .ico { color: var(--state-error); }
          .sos-option--er .tag {
            display: inline-block;
            margin-left: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--state-error);
            border: 1px solid var(--state-error);
            border-radius: var(--radius-sm);
            padding: 0 6px;
            vertical-align: middle;
            line-height: 1.6;
          }
        </style>

        <!-- ============ Top app bar ============ -->
        <header class="sos-appbar">
            <div class="sos-appbar-inner">
                <button type="button" class="sos-back" aria-label="返回">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <span class="sos-appbar-title">紧急求助</span>
                <span class="sos-device-pill" role="status" aria-label="设备状态：在线">
                    <span class="sos-device-dot" aria-hidden="true"></span>
                    <span>设备在线</span>

        <!-- ============ Location opt-in strip ============ -->
        <div class="sos-loc-strip" role="status" aria-label="位置授权状态">

        <!-- ============ Main SOS zone ============ -->

            <div class="sos-headline">

            <div class="sos-button-wrap">
                <button type="button" id="sosBtn" class="sos-button" aria-label="长按2秒向家属发送紧急求助">
                    <span class="sos-btn-icon">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </span>
                    <span class="sos-btn-word">求助</span>
                    <span class="sos-btn-sub">长按 2 秒</span>
                    <span class="sos-btn-sent">已发送</span>
                </button>
                <svg class="sos-progress" viewBox="0 0 220 220" aria-hidden="true">
                    <circle cx="110" cy="110" r="104" stroke-dasharray="653" stroke-dashoffset="653"></circle>
                </svg>
            </div>

            <p class="sos-hint sos-hint-ready">长按红色按钮 <strong>2 秒</strong> 发送求助 · 10 秒内可取消</p>

            <div class="sos-success" aria-live="polite">
                <div class="sos-success-card">
                    <svg class="check" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                    <div class="body">
                        <h2>已通知家属 张先生</h2>
                        <p class="meta">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                            <span>位置已共享 · 家属正在赶来</span>
                        </p>
                    </div>
                </div>
                <button type="button" class="sos-cancel-btn" id="cancelBtn">取消误报</button>
            </div>
        </section>

        <!-- ============ Other contact options ============ -->
        <section class="sos-options" aria-label="其他求助方式">
            <h2 class="sos-options-title">其他求助方式</h2>
            <div class="sos-options-list">
                <button type="button" class="sos-option sos-option--family">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span class="txt">
                        <span class="name">先联系家属</span>
                        <span class="desc">张先生 · 138 1234 5678</span>
                    </span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>

                <button type="button" class="sos-option sos-option--community">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
                    <span class="txt">
                        <span class="name">拨打社区电话</span>
                        <span class="desc">阳光社区服务站 · 021-8765 4321</span>
                    </span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>

                <button type="button" class="sos-option sos-option--er">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    <span class="txt">
                        <span class="name">拨打 120<span class="tag">急救</span></span>
                        <span class="desc">急救中心 · 直接呼叫救护车</span>
                    </span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </section>

        <!-- ============ Bottom navigation (active = sos) ============ -->
        <nav data-mobile-nav="global" class="bottom-nav fixed bottom-0 left-0 right-0 z-40 h-[64px] bg-[var(--card)] border-t border-[var(--border)]" style="padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px -4px rgba(61,43,15,0.08)">
      <div class="nav-inner w-full max-w-md mx-auto grid grid-cols-4 h-full">
        <a data-nav-key="home" data-dom-id="nav-home" class="nav-item flex flex-col items-center justify-center gap-1 px-1 h-full whitespace-nowrap text-[var(--muted-foreground)]" href="#">
          <svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
          <span class="nav-label text-[13px] leading-none font-medium whitespace-nowrap">首页</span>
        </a>
        <a data-nav-key="health" data-dom-id="nav-health" class="nav-item flex flex-col items-center justify-center gap-1 px-1 h-full whitespace-nowrap text-[var(--muted-foreground)]" href="#">
          <svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="nav-label text-[13px] leading-none font-medium whitespace-nowrap">健康</span>
        </a>
        <a data-nav-key="report" data-dom-id="nav-report" class="nav-item flex flex-col items-center justify-center gap-1 px-1 h-full whitespace-nowrap text-[var(--muted-foreground)]" href="#">
          <svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
          <span class="nav-label text-[13px] leading-none font-medium whitespace-nowrap">报告</span>
        </a>
        <a data-nav-key="sos" data-dom-id="nav-sos" class="nav-item nav-sos flex flex-col items-center justify-center gap-1 px-1 h-full whitespace-nowrap" href="#" aria-label="一键求助">
          <span class="nav-sos-circle w-[44px] h-[44px] rounded-full bg-[var(--primary)] flex items-center justify-center text-[var(--primary-foreground)]" style="box-shadow:0 4px 16px -4px rgba(61,43,15,0.10),0 2px 4px -2px rgba(61,43,15,0.06)">
            <svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </span>
          <span class="nav-label text-[13px] leading-none font-semibold whitespace-nowrap text-[var(--primary)]">求助</span>
        </a>
      </div>
    </nav>
    </main>

    <script>
      (function () {
        var page = document.getElementById('sosPage');
        var btn = document.getElementById('sosBtn');
        var wrap = btn ? btn.parentElement : null;
        var cancelBtn = document.getElementById('cancelBtn');
        var timer = null;
        if (!btn || !wrap) return;

        function startHold() {
          if (page.classList.contains('is-confirmed')) return;
          wrap.classList.add('is-holding');
          timer = window.setTimeout(function () {
            wrap.classList.remove('is-holding');
            page.classList.add('is-confirmed');
            if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
          }, 2000);
        }
        function endHold() {
          wrap.classList.remove('is-holding');
          if (timer) { window.clearTimeout(timer); timer = null; }
        }
        btn.addEventListener('pointerdown', startHold);
        btn.addEventListener('pointerup', endHold);
        btn.addEventListener('pointerleave', endHold);
        btn.addEventListener('pointercancel', endHold);
        btn.addEventListener('keydown', function (e) {
          if ((e.key === ' ' || e.key === 'Enter') && !timer && !page.classList.contains('is-confirmed')) {
            startHold();
          }
        });
        btn.addEventListener('keyup', endHold);
        if (cancelBtn) {
          cancelBtn.addEventListener('click', function () {
            page.classList.remove('is-confirmed');
          });
        }
      })();
    </script>
</body>

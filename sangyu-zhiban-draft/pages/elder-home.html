    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 暖琥珀适老化设计令牌 (DRAFT)
   Brand: Warm Honey Amber (暖琥珀色) · Soft Ivory (柔象牙白)
   色调从深红枫叶转为偏黄暖琥珀，更明亮温暖
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Warm Honey Amber (暖琥珀/蜂蜜金) ---- */
  --sangyu-primary: #B5832E;
  --sangyu-primary-50: #FBF5EC;
  --sangyu-primary-100: #F5E6CC;
  --sangyu-primary-200: #E8CC99;
  --sangyu-primary-300: #D4B366;
  --sangyu-primary-400: #C49A3D;
  --sangyu-primary-500: #B5832E;
  --sangyu-primary-600: #9A6E25;
  --sangyu-primary-700: #7A561D;
  --sangyu-primary-800: #5C4116;
  --sangyu-primary-900: #3D2B0F;

  /* ---- Neutral Warm Scale (暖中性色, 琥珀底调) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FFF9F0;
  --sangyu-neutral-100: #F5EFE2;
  --sangyu-neutral-200: #E8DDC8;
  --sangyu-neutral-300: #D5C5A8;
  --sangyu-neutral-400: #B8A580;
  --sangyu-neutral-500: #8A7A5C;
  --sangyu-neutral-600: #6B5D44;
  --sangyu-neutral-700: #4A3F2E;
  --sangyu-neutral-800: #2A2316;
  --sangyu-neutral-900: #1A150F;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #C49A3D;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 柔象牙白基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FFF9F0;
  --sangyu-foreground: #2A2316;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A2316;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A2316;
  --sangyu-primary-foreground: #FFF9F0;
  --sangyu-muted: #F5EFE2;
  --sangyu-muted-foreground: #6B5D44;
  --sangyu-border: #E8DDC8;
  --sangyu-input: #F5EFE2;
  --sangyu-ring: #B5832E;

  /* Non-prefixed semantic aliases */
  --background: #FFF9F0;
  --foreground: #2A2316;
  --card: #FFFFFF;
  --card-foreground: #2A2316;
  --popover: #FFFFFF;
  --popover-foreground: #2A2316;
  --primary: #B5832E;
  --primary-foreground: #FFF9F0;
  --muted: #F5EFE2;
  --muted-foreground: #6B5D44;
  --border: #E8DDC8;
  --input: #F5EFE2;
  --ring: #B5832E;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度, 琥珀底调 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 43, 15, 0.05), 0 1px 1px rgba(61, 43, 15, 0.03);
  --sangyu-shadow-2: 0 4px 16px -4px rgba(61, 43, 15, 0.10), 0 2px 4px -2px rgba(61, 43, 15, 0.06);
  --sangyu-shadow-3: 0 16px 48px -16px rgba(61, 43, 15, 0.18);
  --shadow-1: 0 1px 2px rgba(61, 43, 15, 0.05), 0 1px 1px rgba(61, 43, 15, 0.03);
  --shadow-2: 0 4px 16px -4px rgba(61, 43, 15, 0.10), 0 2px 4px -2px rgba(61, 43, 15, 0.06);
  --shadow-3: 0 16px 48px -16px rgba(61, 43, 15, 0.18);
}

/* ============================================================
   Dark Mode — 深琥珀棕基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #2A2316;
  --sangyu-foreground: #FFF9F0;
  --sangyu-card: #3D2B0F;
  --sangyu-card-foreground: #FFF9F0;
  --sangyu-popover: #3D2B0F;
  --sangyu-popover-foreground: #FFF9F0;
  --sangyu-primary: #D4B366;
  --sangyu-primary-foreground: #2A2316;
  --sangyu-muted: #4A3F2E;
  --sangyu-muted-foreground: #D5C5A8;
  --sangyu-border: #5C4116;
  --sangyu-input: #4A3F2E;
  --sangyu-ring: #D4B366;

  --background: #2A2316;
  --foreground: #FFF9F0;
  --card: #3D2B0F;
  --card-foreground: #FFF9F0;
  --popover: #3D2B0F;
  --popover-foreground: #FFF9F0;
  --primary: #D4B366;
  --primary-foreground: #2A2316;
  --muted: #4A3F2E;
  --muted-foreground: #D5C5A8;
  --border: #5C4116;
  --input: #4A3F2E;
  --ring: #D4B366;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {

  font-size: clamp(32px, 8vw, 48px);

  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

    </style>

<body>
    <style id="critical-layout">
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        overflow-x: hidden;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 18px;
        line-height: 1.65;
        color: var(--foreground);
        background-color: var(--background);
        -webkit-tap-highlight-color: transparent;
      }
      a { text-decoration: none; color: inherit; }
      img { display: block; max-width: 100%; }
      svg { display: block; }

      .page-container {
        max-width: 480px;
        margin: 0 auto;
        position: relative;
        min-height: 100vh;
        background: var(--background);
        padding-bottom: calc(104px + env(safe-area-inset-bottom));
        overflow: hidden;
      }

      /* ===== Hero — 品牌色强存在感（麦肯式实色头图） ===== */
      .hero {
        background: var(--primary);
        color: var(--primary-foreground);
        padding: 18px 20px 24px;
        border-bottom-left-radius: var(--radius-lg);
        border-bottom-right-radius: var(--radius-lg);
        box-shadow: var(--shadow-2);
      }
      .hero-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--primary-foreground);
      }
      .brand-mark { width: 22px; height: 22px; color: var(--primary-foreground); flex-shrink: 0; }
      .gear {
        width: 40px; height: 40px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: var(--radius-full);
        color: var(--primary-foreground);
        -webkit-tap-highlight-color: transparent;
        transition: background 0.15s ease;
      }
      .gear:active { background: color-mix(in srgb, var(--primary-foreground) 16%, transparent); }
      .gear svg { width: 22px; height: 22px; }

      .hero-greet {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .avatar {
        width: 58px; height: 58px;
        border-radius: var(--radius-full);
        background: var(--primary-foreground);
        color: var(--primary);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; font-weight: 700;
        flex-shrink: 0;
        box-shadow: var(--shadow-1);
      }
      .greet-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
      .greeting-name {
        font-size: 28px; font-weight: 700; line-height: 1.18;
        margin: 0; color: var(--primary-foreground);
        text-wrap: balance;
      }
      .greeting-date {
        font-size: 18px; font-weight: 500; line-height: 1.3;
        margin: 0;
        color: color-mix(in srgb, var(--primary-foreground) 92%, transparent);
      }
      .device-status {
        display: inline-flex; align-items: center; gap: 7px;
        margin-top: 6px;
      }
      .status-dot { width: 9px; height: 9px; border-radius: var(--radius-full); flex-shrink: 0; }
      .status-dot.online {
        background: var(--state-success);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--state-success) 28%, transparent);
      }
      .status-dot.offline {
        background: var(--muted-foreground);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted-foreground) 28%, transparent);
      }
      .status-text { font-size: 16px; font-weight: 600; color: var(--primary-foreground); }
      .status-text.offline { color: color-mix(in srgb, var(--primary-foreground) 80%, transparent); }

      .hero-pills { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 12px;
        border-radius: var(--radius-full);
        font-size: 14px; font-weight: 600;
        background: color-mix(in srgb, var(--primary-foreground) 18%, transparent);
        color: var(--primary-foreground);
      }
      .pill svg { width: 15px; height: 15px; flex-shrink: 0; }
      .pill .check { color: var(--state-success); }

      /* ===== Body content ===== */
      .body-content { padding: 20px 16px 0; }

      /* ===== Reminder card — 左侧琥珀强调条 + 裸图标 ===== */
      .reminder { margin-bottom: 20px; }
      .reminder-card {
        display: flex; align-items: stretch; gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 16px;
        box-shadow: var(--shadow-1);
        overflow: hidden;
      }
      .accent-strip {
        width: 4px; border-radius: var(--radius-full);
        background: var(--primary);
        flex-shrink: 0; align-self: stretch;
      }
      .reminder-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
      .reminder-label { font-size: 14px; font-weight: 500; color: var(--muted-foreground); margin: 0 0 4px; }
      .reminder-title { font-size: 20px; font-weight: 600; color: var(--foreground); line-height: 1.3; margin: 0; }
      .reminder-meta { font-size: 15px; color: var(--muted-foreground); margin: 4px 0 0; }
      .reminder-meta .time { color: var(--primary); font-weight: 700; }
      .reminder-icon { width: 40px; height: 40px; flex-shrink: 0; align-self: center; color: var(--primary); }
      .reminder-icon svg { width: 100%; height: 100%; }

      /* ===== Quick actions — SOS 实体红键 + 三项常用 ===== */
      .quick-actions { margin-bottom: 8px; }

      .sos-btn {
        display: flex; align-items: center; gap: 14px;
        width: 100%;
        background: var(--state-error);
        color: var(--sangyu-neutral-0);
        border-radius: var(--radius-lg);
        padding: 16px 18px;
        min-height: 64px;
        box-shadow: var(--shadow-2);
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        position: relative;
        overflow: hidden;
      }
      .sos-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sangyu-neutral-0) 14%, transparent);
        pointer-events: none;
      }
      .sos-btn:active { transform: scale(0.985); box-shadow: var(--shadow-1); }
      .sos-icon { width: 30px; height: 30px; flex-shrink: 0; color: var(--sangyu-neutral-0); }
      .sos-icon svg { width: 100%; height: 100%; }
      .sos-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
      .sos-label { font-size: 22px; font-weight: 700; line-height: 1.2; }
      .sos-desc { font-size: 15px; line-height: 1.3; color: color-mix(in srgb, var(--sangyu-neutral-0) 88%, transparent); }

      .qa-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 12px;
      }
      .qa-card {
        display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
        padding: 14px 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        min-height: 104px;
        box-shadow: var(--shadow-1);
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease;
      }
      .qa-card:active { transform: scale(0.97); }
      .qa-icon { width: 30px; height: 30px; color: var(--primary); flex-shrink: 0; }
      .qa-icon svg { width: 100%; height: 100%; }
      .qa-text { display: flex; flex-direction: column; gap: 2px; }
      .qa-label { font-size: 16px; font-weight: 600; line-height: 1.25; color: var(--foreground); }
      .qa-desc { font-size: 13px; line-height: 1.3; color: var(--muted-foreground); }

      @media (prefers-reduced-motion: reduce) {
        .sos-btn, .qa-card, .gear { transition: none; }
        .sos-btn:active, .qa-card:active { transform: none; }
      }
    </style>

<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>家属首页</title>
    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 枫叶红适老化设计令牌
   Brand: Deep Maple Red (枫叶色) · Warm Ivory (暖米色)
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Deep Maple Red (枫叶红) ---- */
  --sangyu-primary: #7C2020;
  --sangyu-primary-50: #FBF0F0;
  --sangyu-primary-100: #F5DCDC;
  --sangyu-primary-200: #E8B8B8;
  --sangyu-primary-300: #D48A8A;
  --sangyu-primary-400: #B85151;
  --sangyu-primary-500: #9A2D2D;
  --sangyu-primary-600: #7C2020;
  --sangyu-primary-700: #6B1A1A;
  --sangyu-primary-800: #561515;
  --sangyu-primary-900: #3D1010;

  /* ---- Neutral Warm Scale (暖中性色) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FBF5EF;
  --sangyu-neutral-100: #F5EBE0;
  --sangyu-neutral-200: #E8DDD5;
  --sangyu-neutral-300: #D5C5B8;
  --sangyu-neutral-400: #B8A598;
  --sangyu-neutral-500: #8A7A70;
  --sangyu-neutral-600: #6B5953;
  --sangyu-neutral-700: #4A3D38;
  --sangyu-neutral-800: #2A1A15;
  --sangyu-neutral-900: #1A0F0C;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #B8860B;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 暖米色基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FBF5EF;
  --sangyu-foreground: #2A1A15;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A1A15;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A1A15;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #F5EBE0;
  --sangyu-muted-foreground: #6B5953;
  --sangyu-border: #E8DDD5;
  --sangyu-input: #F5EBE0;
  --sangyu-ring: #7C2020;

  /* Non-prefixed semantic aliases */
  --background: #FBF5EF;
  --foreground: #2A1A15;
  --card: #FFFFFF;
  --card-foreground: #2A1A15;
  --popover: #FFFFFF;
  --popover-foreground: #2A1A15;
  --primary: #7C2020;
  --primary-foreground: #FBF5EF;
  --muted: #F5EBE0;
  --muted-foreground: #6B5953;
  --border: #E8DDD5;
  --input: #F5EBE0;
  --ring: #7C2020;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
  --shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
}

/* ============================================================
   Dark Mode — 枫叶深红基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #3D1010;
  --sangyu-foreground: #FBF5EF;
  --sangyu-card: #5C1A1A;
  --sangyu-card-foreground: #FBF5EF;
  --sangyu-popover: #5C1A1A;
  --sangyu-popover-foreground: #FBF5EF;
  --sangyu-primary: #C04545;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #4A1515;
  --sangyu-muted-foreground: #D5C5B8;
  --sangyu-border: #6B2020;
  --sangyu-input: #4A1515;
  --sangyu-ring: #C04545;

  --background: #3D1010;
  --foreground: #FBF5EF;
  --card: #5C1A1A;
  --card-foreground: #FBF5EF;
  --popover: #5C1A1A;
  --popover-foreground: #FBF5EF;
  --primary: #C04545;
  --primary-foreground: #FBF5EF;
  --muted: #4A1515;
  --muted-foreground: #D5C5B8;
  --border: #6B2020;
  --input: #4A1515;
  --ring: #C04545;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--sangyu-background);
    --color-foreground: var(--sangyu-foreground);
    --color-card: var(--sangyu-card);
    --color-card-foreground: var(--sangyu-card-foreground);
    --color-popover: var(--sangyu-popover);
    --color-popover-foreground: var(--sangyu-popover-foreground);
    --color-primary: var(--sangyu-primary);
    --color-primary-foreground: var(--sangyu-primary-foreground);
    --color-muted: var(--sangyu-muted);
    --color-muted-foreground: var(--sangyu-muted-foreground);
    --color-border: var(--sangyu-border);
    --color-input: var(--sangyu-input);
    --color-ring: var(--sangyu-ring);
    --radius-sm: var(--sangyu-radius-small);
    --radius-md: var(--sangyu-radius-medium);
    --radius-lg: var(--sangyu-radius-large);
  }
  @layer base {
    body { background: var(--sangyu-background); color: var(--sangyu-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
      /* 关键布局CSS — 静态渲染保底 */
      .alert-bar{background-color:rgba(198,40,40,.07);border-left:4px solid var(--state-error);}
      .contact-btn{min-height:52px;}
      .metric-card{min-height:84px;}
      .pulse-dot{box-shadow:0 0 0 0 rgba(45,122,61,.5);}
    </style>
    <main class="bg-[var(--background)] min-h-screen pb-20">
      <div class="w-full max-w-md mx-auto px-4 pt-5 space-y-4">

        <!-- 1. 老人状态摘要卡片 -->
        <section aria-label="老人状态摘要" class="bg-[var(--card)] rounded-lg border border-[var(--border)] p-4 shadow-[var(--shadow-1)]">
          <div class="flex items-center gap-4">
            <img src="../assets/elder-man-portrait.jpg" alt="王大爷头像" class="w-[64px] h-[64px] rounded-full object-cover border-2 border-[var(--sangyu-primary-200)] shrink-0" />
            <div class="flex-1 min-w-0">
              <div class="flex items-baseline gap-2">
                <h1 class="text-[22px] font-semibold text-[var(--foreground)] leading-tight">王大爷</h1>
                <span class="text-[18px] text-[var(--muted-foreground)]">78岁</span>
              </div>
              <div class="flex items-center gap-2 mt-1.5">
                <span class="inline-flex items-center gap-1.5 text-[16px] font-medium text-[var(--state-success)]">
                  <span class="w-[8px] h-[8px] rounded-full bg-[var(--state-success)]"></span>在线
                </span>
                <span class="text-[var(--border)] text-[16px]">|</span>
                <span class="inline-flex items-center gap-1 text-[16px] text-[var(--muted-foreground)]">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>在家中
                </span>
              </div>
            </div>
          </div>
        </section>

        <!-- 2. 设备在线状态 -->
        <section aria-label="设备在线状态" class="bg-[var(--card)] rounded-lg border border-[var(--border)] p-4 shadow-[var(--shadow-1)]">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-[18px] font-semibold text-[var(--foreground)]">设备状态</h2>
            <span class="text-[15px] text-[var(--state-success)] font-medium">全部在线</span>
          </div>
          <ul class="space-y-3">
            <li class="flex items-center justify-between">
              <span class="flex items-center gap-2.5 text-[18px] text-[var(--foreground)]">
                <svg class="w-5 h-5 text-[var(--muted-foreground)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6"/></svg>智能手环
              </span>
              <span class="flex items-center gap-1 text-[16px] text-[var(--state-success)] font-medium">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>在线
              </span>
            </li>
            <li class="flex items-center justify-between">
              <span class="flex items-center gap-2.5 text-[18px] text-[var(--foreground)]">
                <svg class="w-5 h-5 text-[var(--muted-foreground)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"/><path d="M5 8a7 7 0 1 0 14 0"/><path d="M9 21h6"/></svg>血压计
              </span>
              <span class="flex items-center gap-1 text-[16px] text-[var(--state-success)] font-medium">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>在线
              </span>
            </li>
            <li class="flex items-center justify-between">
              <span class="flex items-center gap-2.5 text-[18px] text-[var(--foreground)]">
                <svg class="w-5 h-5 text-[var(--muted-foreground)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>门磁

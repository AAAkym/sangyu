<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键求助</title>
    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 枫叶红适老化设计令牌
   Brand: Deep Maple Red (枫叶色) · Warm Ivory (暖米色)
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Deep Maple Red (枫叶红) ---- */
  --sangyu-primary: #7C2020;
  --sangyu-primary-50: #FBF0F0;
  --sangyu-primary-100: #F5DCDC;
  --sangyu-primary-200: #E8B8B8;
  --sangyu-primary-300: #D48A8A;
  --sangyu-primary-400: #B85151;
  --sangyu-primary-500: #9A2D2D;
  --sangyu-primary-600: #7C2020;
  --sangyu-primary-700: #6B1A1A;
  --sangyu-primary-800: #561515;
  --sangyu-primary-900: #3D1010;

  /* ---- Neutral Warm Scale (暖中性色) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FBF5EF;
  --sangyu-neutral-100: #F5EBE0;
  --sangyu-neutral-200: #E8DDD5;
  --sangyu-neutral-300: #D5C5B8;
  --sangyu-neutral-400: #B8A598;
  --sangyu-neutral-500: #8A7A70;
  --sangyu-neutral-600: #6B5953;
  --sangyu-neutral-700: #4A3D38;
  --sangyu-neutral-800: #2A1A15;
  --sangyu-neutral-900: #1A0F0C;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #B8860B;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 暖米色基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FBF5EF;
  --sangyu-foreground: #2A1A15;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A1A15;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A1A15;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #F5EBE0;
  --sangyu-muted-foreground: #6B5953;
  --sangyu-border: #E8DDD5;
  --sangyu-input: #F5EBE0;
  --sangyu-ring: #7C2020;

  /* Non-prefixed semantic aliases */
  --background: #FBF5EF;
  --foreground: #2A1A15;
  --card: #FFFFFF;
  --card-foreground: #2A1A15;
  --popover: #FFFFFF;
  --popover-foreground: #2A1A15;
  --primary: #7C2020;
  --primary-foreground: #FBF5EF;
  --muted: #F5EBE0;
  --muted-foreground: #6B5953;
  --border: #E8DDD5;
  --input: #F5EBE0;
  --ring: #7C2020;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
  --shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
}

/* ============================================================
   Dark Mode — 枫叶深红基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #3D1010;
  --sangyu-foreground: #FBF5EF;
  --sangyu-card: #5C1A1A;
  --sangyu-card-foreground: #FBF5EF;
  --sangyu-popover: #5C1A1A;
  --sangyu-popover-foreground: #FBF5EF;
  --sangyu-primary: #C04545;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #4A1515;
  --sangyu-muted-foreground: #D5C5B8;
  --sangyu-border: #6B2020;
  --sangyu-input: #4A1515;
  --sangyu-ring: #C04545;

  --background: #3D1010;
  --foreground: #FBF5EF;
  --card: #5C1A1A;
  --card-foreground: #FBF5EF;
  --popover: #5C1A1A;
  --popover-foreground: #FBF5EF;
  --primary: #C04545;
  --primary-foreground: #FBF5EF;
  --muted: #4A1515;
  --muted-foreground: #D5C5B8;
  --border: #6B2020;
  --input: #4A1515;
  --ring: #C04545;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--sangyu-background);
    --color-foreground: var(--sangyu-foreground);
    --color-card: var(--sangyu-card);
    --color-card-foreground: var(--sangyu-card-foreground);
    --color-popover: var(--sangyu-popover);
    --color-popover-foreground: var(--sangyu-popover-foreground);
    --color-primary: var(--sangyu-primary);
    --color-primary-foreground: var(--sangyu-primary-foreground);
    --color-muted: var(--sangyu-muted);
    --color-muted-foreground: var(--sangyu-muted-foreground);
    --color-border: var(--sangyu-border);
    --color-input: var(--sangyu-input);
    --color-ring: var(--sangyu-ring);
    --radius-sm: var(--sangyu-radius-small);
    --radius-md: var(--sangyu-radius-medium);
    --radius-lg: var(--sangyu-radius-large);
  }
  @layer base {
    body { background: var(--sangyu-background); color: var(--sangyu-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--sangyu-background); }
      .text-background { color: var(--sangyu-background); }
      .border-background { border-color: var(--sangyu-background); }
      .ring-background { --tw-ring-color: var(--sangyu-background); }
      .bg-foreground { background-color: var(--sangyu-foreground); }
      .text-foreground { color: var(--sangyu-foreground); }
      .border-foreground { border-color: var(--sangyu-foreground); }
      .ring-foreground { --tw-ring-color: var(--sangyu-foreground); }
      .bg-card { background-color: var(--sangyu-card); }
      .text-card { color: var(--sangyu-card); }
      .border-card { border-color: var(--sangyu-card); }
      .ring-card { --tw-ring-color: var(--sangyu-card); }
      .bg-card-foreground { background-color: var(--sangyu-card-foreground); }
      .text-card-foreground { color: var(--sangyu-card-foreground); }
      .border-card-foreground { border-color: var(--sangyu-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--sangyu-card-foreground); }
      .bg-popover { background-color: var(--sangyu-popover); }
      .text-popover { color: var(--sangyu-popover); }
      .border-popover { border-color: var(--sangyu-popover); }
      .ring-popover { --tw-ring-color: var(--sangyu-popover); }
      .bg-popover-foreground { background-color: var(--sangyu-popover-foreground); }
      .text-popover-foreground { color: var(--sangyu-popover-foreground); }
      .border-popover-foreground { border-color: var(--sangyu-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--sangyu-popover-foreground); }
      .bg-primary { background-color: var(--sangyu-primary); }
      .text-primary { color: var(--sangyu-primary); }
      .border-primary { border-color: var(--sangyu-primary); }
      .ring-primary { --tw-ring-color: var(--sangyu-primary); }
      .bg-primary-foreground { background-color: var(--sangyu-primary-foreground); }
      .text-primary-foreground { color: var(--sangyu-primary-foreground); }
      .border-primary-foreground { border-color: var(--sangyu-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--sangyu-primary-foreground); }
      .bg-muted { background-color: var(--sangyu-muted); }
      .text-muted { color: var(--sangyu-muted); }
      .border-muted { border-color: var(--sangyu-muted); }
      .ring-muted { --tw-ring-color: var(--sangyu-muted); }
      .bg-muted-foreground { background-color: var(--sangyu-muted-foreground); }
      .text-muted-foreground { color: var(--sangyu-muted-foreground); }
      .border-muted-foreground { border-color: var(--sangyu-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--sangyu-muted-foreground); }
      .bg-border { background-color: var(--sangyu-border); }
      .text-border { color: var(--sangyu-border); }
      .border-border { border-color: var(--sangyu-border); }
      .ring-border { --tw-ring-color: var(--sangyu-border); }
      .bg-input { background-color: var(--sangyu-input); }
      .text-input { color: var(--sangyu-input); }
      .border-input { border-color: var(--sangyu-input); }
      .ring-input { --tw-ring-color: var(--sangyu-input); }
      .bg-ring { background-color: var(--sangyu-ring); }
      .text-ring { color: var(--sangyu-ring); }
      .border-ring { border-color: var(--sangyu-ring); }
      .ring-ring { --tw-ring-color: var(--sangyu-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="fixed inset-0 overflow-y-auto bg-[var(--primary)] text-[var(--primary-foreground)]">
        <style id="critical-layout">
          /* critical layout: full-screen deep-red emergency background (pre-runtime) */
          main {
            background-color: var(--primary);
            color: var(--primary-foreground);
            min-height: 100vh;
            min-height: 100dvh;
          }
          .sos-screen {
            min-height: 100vh;
            min-height: 100dvh;
          }
          .sos-button {
            width: 200px;
            height: 200px;
            min-width: 180px;
            min-height: 180px;
            border-radius: var(--radius-full);
            background-color: var(--state-error);
            animation: sos-pulse 1.6s ease-in-out infinite;
            box-shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.45);
          }
          .countdown-number {
            font-size: clamp(56px, 16vw, 88px);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
          }
          @keyframes sos-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
          }
          @media (prefers-reduced-motion: reduce) {
            .sos-button { animation: none; }
          }
        </style>
        <div class="sos-screen flex flex-col items-center px-6 pt-10 pb-8 mx-auto max-w-md">
          <!-- 顶部标题区 -->
          <header class="text-center">
            <div class="inline-flex items-center justify-center mb-2">
              <i data-lucide="alert-triangle" class="w-7 h-7" style="color: rgba(251, 245, 239, 0.9);"></i>
            </div>
            <h1 class="text-[28px] leading-tight font-bold" style="color: var(--primary-foreground);">紧急求助</h1>
          </header>

          <!-- 倒计时显示 -->
          <div class="text-center mt-5">
            <div class="countdown-number" style="color: var(--primary-foreground);">5</div>
            <p class="text-[18px] mt-2" style="color: rgba(251, 245, 239, 0.85);">即将通知紧急联系人</p>
          </div>

          <!-- 超大圆形求助按钮 -->
          <div class="flex-1 flex items-center justify-center w-full my-6 min-h-[200px]">
            <button type="button" class="sos-button flex flex-col items-center justify-center gap-3" style="color: #FFFFFF;">
              <i data-lucide="phone" class="w-12 h-12"></i>
              <span class="text-[24px] font-bold">立即求助</span>
            </button>
          </div>

          <!-- 取消按钮 -->
          <button type="button" class="w-full h-[56px] rounded-[var(--radius-full)] border-2 text-[20px] font-semibold" style="border-color: rgba(251, 245, 239, 0.5); background-color: rgba(255, 255, 255, 0.08); color: var(--primary-foreground);">
            取消
          </button>

          <!-- 联系选项列表 -->
          <div class="w-full mt-8 flex flex-col gap-3">
            <button type="button" class="w-full flex items-center gap-4 px-5 py-4 rounded-[var(--radius-lg)]" style="background-color: rgba(255, 255, 255, 0.15); color: var(--primary-foreground);">
              <i data-lucide="phone" class="w-7 h-7" style="flex-shrink: 0;"></i>
              <span class="text-[20px] font-medium text-left flex-1">联系家属</span>
              <i data-lucide="chevron-right" class="w-6 h-6" style="opacity: 0.6;"></i>
            </button>
            <button type="button" class="w-full flex items-center gap-4 px-5 py-4 rounded-[var(--radius-lg)]" style="background-color: rgba(255, 255, 255, 0.15); color: var(--primary-foreground);">
              <i data-lucide="phone" class="w-7 h-7" style="flex-shrink: 0;"></i>
              <span class="text-[20px] font-medium text-left flex-1">联系社区</span>
              <i data-lucide="chevron-right" class="w-6 h-6" style="opacity: 0.6;"></i>
            </button>
            <button type="button" class="w-full flex items-center gap-4 px-5 py-4 rounded-[var(--radius-lg)]" style="background-color: rgba(255, 255, 255, 0.15); color: var(--primary-foreground);">
              <i data-lucide="phone" class="w-7 h-7" style="flex-shrink: 0;"></i>
              <span class="text-[20px] font-medium text-left flex-1">呼叫急救 120</span>
              <i data-lucide="chevron-right" class="w-6 h-6" style="opacity: 0.6;"></i>
            </button>
          </div>

          <!-- 位置授权提示 -->
          <p class="text-[15px] mt-6 text-center flex items-center justify-center gap-1.5" style="color: rgba(251, 245, 239, 0.65);">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
            <span>已获取您的位置信息，将分享给紧急联系人</span>
          </p>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

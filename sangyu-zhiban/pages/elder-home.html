<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老人首页</title>
    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 枫叶红适老化设计令牌
   Brand: Deep Maple Red (枫叶色) · Warm Ivory (暖米色)
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Deep Maple Red (枫叶红) ---- */
  --sangyu-primary: #7C2020;
  --sangyu-primary-50: #FBF0F0;
  --sangyu-primary-100: #F5DCDC;
  --sangyu-primary-200: #E8B8B8;
  --sangyu-primary-300: #D48A8A;
  --sangyu-primary-400: #B85151;
  --sangyu-primary-500: #9A2D2D;
  --sangyu-primary-600: #7C2020;
  --sangyu-primary-700: #6B1A1A;
  --sangyu-primary-800: #561515;
  --sangyu-primary-900: #3D1010;

  /* ---- Neutral Warm Scale (暖中性色) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FBF5EF;
  --sangyu-neutral-100: #F5EBE0;
  --sangyu-neutral-200: #E8DDD5;
  --sangyu-neutral-300: #D5C5B8;
  --sangyu-neutral-400: #B8A598;
  --sangyu-neutral-500: #8A7A70;
  --sangyu-neutral-600: #6B5953;
  --sangyu-neutral-700: #4A3D38;
  --sangyu-neutral-800: #2A1A15;
  --sangyu-neutral-900: #1A0F0C;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #B8860B;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 暖米色基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FBF5EF;
  --sangyu-foreground: #2A1A15;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A1A15;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A1A15;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #F5EBE0;
  --sangyu-muted-foreground: #6B5953;
  --sangyu-border: #E8DDD5;
  --sangyu-input: #F5EBE0;
  --sangyu-ring: #7C2020;

  /* Non-prefixed semantic aliases */
  --background: #FBF5EF;
  --foreground: #2A1A15;
  --card: #FFFFFF;
  --card-foreground: #2A1A15;
  --popover: #FFFFFF;
  --popover-foreground: #2A1A15;
  --primary: #7C2020;
  --primary-foreground: #FBF5EF;
  --muted: #F5EBE0;
  --muted-foreground: #6B5953;
  --border: #E8DDD5;
  --input: #F5EBE0;
  --ring: #7C2020;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
  --shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
}

/* ============================================================
   Dark Mode — 枫叶深红基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #3D1010;
  --sangyu-foreground: #FBF5EF;
  --sangyu-card: #5C1A1A;
  --sangyu-card-foreground: #FBF5EF;
  --sangyu-popover: #5C1A1A;
  --sangyu-popover-foreground: #FBF5EF;
  --sangyu-primary: #C04545;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #4A1515;
  --sangyu-muted-foreground: #D5C5B8;
  --sangyu-border: #6B2020;
  --sangyu-input: #4A1515;
  --sangyu-ring: #C04545;

  --background: #3D1010;
  --foreground: #FBF5EF;
  --card: #5C1A1A;
  --card-foreground: #FBF5EF;
  --popover: #5C1A1A;
  --popover-foreground: #FBF5EF;
  --primary: #C04545;
  --primary-foreground: #FBF5EF;
  --muted: #4A1515;
  --muted-foreground: #D5C5B8;
  --border: #6B2020;
  --input: #4A1515;
  --ring: #C04545;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

    </style>

    <style type="text/tailwindcss">

<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
      html { -webkit-text-size-adjust: 100%; }
      body { overflow-x: hidden; }
      .page-container { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; }
      .elder-avatar { width: 64px; height: 64px; border-radius: var(--radius-full); object-fit: cover; border: 3px solid var(--card); box-shadow: var(--shadow-1); }
      .entry-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
      .entry-card:active { transform: scale(0.98); }
      .sos-btn { transition: transform 0.15s ease; }
      .sos-btn:active { transform: scale(0.97); }
      .icon-circle { width: 48px; height: 48px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      @media (prefers-reduced-motion: reduce) {
        .entry-card, .sos-btn { transition: none; }
      }
    </style>
    <main class="page-container bg-[var(--background)] px-4 pb-24 pt-2">
      <!-- 1. 老人头像问候区 -->
      <section class="flex items-center gap-4 pt-5 pb-5">
        <img src="../assets/elder-woman-portrait.jpg" alt="王奶奶" class="elder-avatar shrink-0" />
        <div class="flex flex-col gap-1 min-w-0">
          <h1 class="text-[26px] font-bold text-[var(--foreground)] leading-tight">王奶奶，下午好</h1>
          <p class="text-[17px] text-[var(--muted-foreground)]">今天是8月29日 星期五</p>
        </div>
      </section>

      <!-- 2. 下次提醒卡片 -->
      <section class="mb-5">
        <div class="bg-[var(--card)] rounded-[var(--radius-lg)] border border-[var(--border)] p-4 flex items-stretch gap-4 shadow-[var(--shadow-1)]">
          <div class="w-1.5 rounded-full bg-[var(--primary)] shrink-0"></div>
          <div class="flex-1 min-w-0">
            <p class="text-[15px] text-[var(--muted-foreground)] mb-1">下次提醒</p>
            <p class="text-[22px] font-semibold text-[var(--foreground)] leading-snug">服用降压药</p>
            <p class="text-[15px] text-[var(--muted-foreground)] mt-1">今天 14:00 · 饭后服用 1片</p>
          </div>
          <div class="shrink-0 flex items-start pt-0.5">
            <div class="icon-circle bg-[var(--muted)]">
              <svg class="w-5 h-5 text-[var(--primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. 一键求助大按钮 -->
      <section class="mb-6">
        <button class="sos-btn w-full text-[var(--primary-foreground)] rounded-[var(--radius-lg)] min-h-[64px] py-5 px-6 flex items-center justify-center gap-3 shadow-[var(--shadow-2)]" style="background:linear-gradient(135deg, var(--primary) 0%, var(--sangyu-primary-700) 100%)">
          <svg class="w-8 h-8 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span class="text-[26px] font-bold">一键求助</span>
        </button>
      </section>

      <!-- 4. 语音陪伴入口 -->
      <a href="#" class="entry-card block bg-[var(--card)] rounded-[var(--radius-lg)] border border-[var(--border)] p-4 mb-3 min-h-[68px]">
        <div class="flex items-center gap-4">
          <div class="icon-circle bg-[var(--sangyu-primary-50)]">
            <svg class="w-6 h-6 text-[var(--primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[20px] font-semibold text-[var(--foreground)]">语音陪伴</p>
            <p class="text-[15px] text-[var(--muted-foreground)] mt-0.5">和我聊聊天</p>

      <!-- 5. 健康数据入口 -->

          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[20px] font-semibold text-[var(--foreground)]">健康数据</p>

          </div>
          <svg class="w-6 h-6 text-[var(--muted-foreground)] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>

      <!-- 6. 服务预约入口 -->
      <a href="#" class="entry-card block bg-[var(--card)] rounded-[var(--radius-lg)] border border-[var(--border)] p-4 mb-3 min-h-[68px]">
        <div class="flex items-center gap-4">
          <div class="icon-circle bg-[var(--sangyu-primary-50)]">
            <svg class="w-6 h-6 text-[var(--primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[20px] font-semibold text-[var(--foreground)]">服务预约</p>
            <p class="text-[15px] text-[var(--muted-foreground)] mt-0.5">家政 / 送餐 / 陪诊</p>
          </div>
          <svg class="w-6 h-6 text-[var(--muted-foreground)] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>
    </main>

    <!-- 7. 底部导航 -->

      <div class="w-full max-w-md mx-auto grid grid-cols-4 h-full">

        <a data-nav-key="health" data-dom-id="nav-health" class="flex flex-col items-center justify-center gap-1 px-1 h-full text-[var(--muted-foreground)]">

<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色选择</title>
    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 枫叶红适老化设计令牌
   Brand: Deep Maple Red (枫叶色) · Warm Ivory (暖米色)
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Deep Maple Red (枫叶红) ---- */
  --sangyu-primary: #7C2020;
  --sangyu-primary-50: #FBF0F0;
  --sangyu-primary-100: #F5DCDC;
  --sangyu-primary-200: #E8B8B8;
  --sangyu-primary-300: #D48A8A;
  --sangyu-primary-400: #B85151;
  --sangyu-primary-500: #9A2D2D;
  --sangyu-primary-600: #7C2020;
  --sangyu-primary-700: #6B1A1A;
  --sangyu-primary-800: #561515;
  --sangyu-primary-900: #3D1010;

  /* ---- Neutral Warm Scale (暖中性色) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FBF5EF;
  --sangyu-neutral-100: #F5EBE0;
  --sangyu-neutral-200: #E8DDD5;
  --sangyu-neutral-300: #D5C5B8;
  --sangyu-neutral-400: #B8A598;
  --sangyu-neutral-500: #8A7A70;
  --sangyu-neutral-600: #6B5953;
  --sangyu-neutral-700: #4A3D38;
  --sangyu-neutral-800: #2A1A15;
  --sangyu-neutral-900: #1A0F0C;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #B8860B;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 暖米色基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FBF5EF;
  --sangyu-foreground: #2A1A15;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A1A15;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A1A15;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #F5EBE0;
  --sangyu-muted-foreground: #6B5953;
  --sangyu-border: #E8DDD5;
  --sangyu-input: #F5EBE0;
  --sangyu-ring: #7C2020;

  /* Non-prefixed semantic aliases */
  --background: #FBF5EF;
  --foreground: #2A1A15;
  --card: #FFFFFF;
  --card-foreground: #2A1A15;
  --popover: #FFFFFF;
  --popover-foreground: #2A1A15;
  --primary: #7C2020;
  --primary-foreground: #FBF5EF;
  --muted: #F5EBE0;
  --muted-foreground: #6B5953;
  --border: #E8DDD5;
  --input: #F5EBE0;
  --ring: #7C2020;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
  --shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
}

/* ============================================================
   Dark Mode — 枫叶深红基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #3D1010;
  --sangyu-foreground: #FBF5EF;
  --sangyu-card: #5C1A1A;
  --sangyu-card-foreground: #FBF5EF;
  --sangyu-popover: #5C1A1A;
  --sangyu-popover-foreground: #FBF5EF;
  --sangyu-primary: #C04545;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #4A1515;
  --sangyu-muted-foreground: #D5C5B8;
  --sangyu-border: #6B2020;
  --sangyu-input: #4A1515;
  --sangyu-ring: #C04545;

  --background: #3D1010;
  --foreground: #FBF5EF;
  --card: #5C1A1A;
  --card-foreground: #FBF5EF;
  --popover: #5C1A1A;
  --popover-foreground: #FBF5EF;
  --primary: #C04545;
  --primary-foreground: #FBF5EF;
  --muted: #4A1515;
  --muted-foreground: #D5C5B8;
  --border: #6B2020;
  --input: #4A1515;
  --ring: #C04545;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--sangyu-background);
    --color-foreground: var(--sangyu-foreground);
    --color-card: var(--sangyu-card);
    --color-card-foreground: var(--sangyu-card-foreground);
    --color-popover: var(--sangyu-popover);
    --color-popover-foreground: var(--sangyu-popover-foreground);
    --color-primary: var(--sangyu-primary);
    --color-primary-foreground: var(--sangyu-primary-foreground);
    --color-muted: var(--sangyu-muted);
    --color-muted-foreground: var(--sangyu-muted-foreground);
    --color-border: var(--sangyu-border);
    --color-input: var(--sangyu-input);
    --color-ring: var(--sangyu-ring);
    --radius-sm: var(--sangyu-radius-small);
    --radius-md: var(--sangyu-radius-medium);
    --radius-lg: var(--sangyu-radius-large);
  }
  @layer base {
    body { background: var(--sangyu-background); color: var(--sangyu-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen font-sans antialiased bg-[var(--primary)] text-[var(--primary-foreground)]">
    <style id="critical-layout">
      /* ===== Critical Layout CSS — renders without Tailwind compilation ===== */
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--primary);
      }
      body {
        color: var(--primary-foreground);
      }

      .role-select-page {
        min-height: 100vh;
        min-height: 100dvh;
        background: linear-gradient(180deg, #7C2020 0%, #6B1A1A 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 44px 24px 24px;
        box-sizing: border-box;
      }
      .role-select-page * { box-sizing: border-box; }

      /* ---- Brand area ---- */
      .brand-area {
        text-align: center;
        margin-bottom: 36px;
      }
      .brand-emblem {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-full);
        background-color: rgba(251, 245, 239, 0.12);
        border: 2px solid rgba(251, 245, 239, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        color: var(--primary-foreground);
      }
      .brand-emblem svg { width: 28px; height: 28px; }
      .brand-name {
        font-size: 36px;
        font-weight: 700;
        color: var(--primary-foreground);
        letter-spacing: 0.06em;
        margin: 0 0 8px;
        line-height: 1.2;
      }
      .brand-slogan {
        font-size: 18px;
        font-weight: 400;
        color: var(--primary-foreground);
        opacity: 0.80;
        margin: 0;
        letter-spacing: 0.03em;
      }

      /* ---- Role cards ---- */
      .role-cards {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        flex: 1;
      }
      .role-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
        background-color: var(--card);
        border-radius: var(--radius-lg);
        padding: 26px 24px;
        min-height: 140px;
        box-shadow: 0 8px 28px -8px rgba(0, 0, 0, 0.22);
        text-decoration: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .role-card:active {
        transform: scale(0.97);
        box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.18);
      }
      .role-card-icon {
        flex-shrink: 0;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-full);
        background-color: var(--muted);
        color: var(--primary);
      }
      .role-card-icon svg { width: 34px; height: 34px; }
      .role-card-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .role-card-title {
        font-size: 28px;
        font-weight: 600;
        color: var(--foreground);
        line-height: 1.3;
      }
      .role-card-desc {
        font-size: 18px;
        color: var(--muted-foreground);
        line-height: 1.5;
      }

      /* ---- Footer ---- */
      .footer-area {
        width: 100%;
        max-width: 420px;
        text-align: center;
        margin-top: 28px;
      }
      .footer-wechat {
        font-size: 15px;
        color: var(--primary-foreground);
        opacity: 0.72;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .footer-wechat svg { width: 16px; height: 16px; }
      .footer-links {
        font-size: 14px;
        color: var(--primary-foreground);
        opacity: 0.58;
        margin: 0;
      }
      .footer-links a {
        color: var(--primary-foreground);
        opacity: 1;
        text-decoration: none;
      }
      .footer-links a:active { text-decoration: underline; }
    </style>
    <main id="page-role-select" class="role-select-page">
      <header id="brand-area" class="brand-area">
        <div class="brand-emblem">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2.96c1.4 9.3 -3.6 12.8 -8.2 13.4"/>

        </div>
        <h1 class="brand-name">桑榆智伴</h1>
        <p class="brand-slogan">温暖陪伴，安心守护</p>

      <nav id="role-cards" class="role-cards" aria-label="选择身份角色">

              <circle cx="12" cy="8" r="5"/>
              <path d="M20 21a8 8 0 0 0-16 0"/>
            </svg>
          </div>
          <div class="role-card-body">
            <span class="role-card-title">我是长辈</span>
            <span class="role-card-desc">贴心陪伴，简单好用</span>
          </div>
        </a>
        <a id="role-card-family" href="#" class="role-card" role="button" aria-label="选择家属身份">
          <div class="role-card-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="role-card-body">
            <span class="role-card-title">我是家属</span>
            <span class="role-card-desc">关爱父母，远程守护</span>
          </div>
        </a>
      </nav>

      <footer id="footer-area" class="footer-area">
        <p id="wechat-auth-entry" class="footer-wechat">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          微信授权登录
        </p>
        <p id="privacy-links" class="footer-links">
          <a href="#">隐私政策</a> | <a href="#">用户协议</a>
        </p>
      </footer>
    </main>
    <script>lucide.createIcons();</script>
</body>

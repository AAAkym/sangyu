<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康数据</title>
    <style id="theme-vars">
/* ============================================================
   桑榆智伴 — 枫叶红适老化设计令牌
   Brand: Deep Maple Red (枫叶色) · Warm Ivory (暖米色)
   ============================================================ */

:root {
  /* ---- Brand Primary Hue: Deep Maple Red (枫叶红) ---- */
  --sangyu-primary: #7C2020;
  --sangyu-primary-50: #FBF0F0;
  --sangyu-primary-100: #F5DCDC;
  --sangyu-primary-200: #E8B8B8;
  --sangyu-primary-300: #D48A8A;
  --sangyu-primary-400: #B85151;
  --sangyu-primary-500: #9A2D2D;
  --sangyu-primary-600: #7C2020;
  --sangyu-primary-700: #6B1A1A;
  --sangyu-primary-800: #561515;
  --sangyu-primary-900: #3D1010;

  /* ---- Neutral Warm Scale (暖中性色) ---- */
  --sangyu-neutral-0: #FFFFFF;
  --sangyu-neutral-50: #FBF5EF;
  --sangyu-neutral-100: #F5EBE0;
  --sangyu-neutral-200: #E8DDD5;
  --sangyu-neutral-300: #D5C5B8;
  --sangyu-neutral-400: #B8A598;
  --sangyu-neutral-500: #8A7A70;
  --sangyu-neutral-600: #6B5953;
  --sangyu-neutral-700: #4A3D38;
  --sangyu-neutral-800: #2A1A15;
  --sangyu-neutral-900: #1A0F0C;

  /* ---- State Colors (语义状态色, 非品牌色) ---- */
  --state-success: #2D7A3D;
  --state-warning: #B8860B;
  --state-error: #C62828;
  --state-info: #1A6B8C;

  /* ============================================================
     Light Mode — 暖米色基底 (家属端、信息密集页)
     ============================================================ */

  /* Semantic brand-prefixed tokens */
  --sangyu-background: #FBF5EF;
  --sangyu-foreground: #2A1A15;
  --sangyu-card: #FFFFFF;
  --sangyu-card-foreground: #2A1A15;
  --sangyu-popover: #FFFFFF;
  --sangyu-popover-foreground: #2A1A15;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #F5EBE0;
  --sangyu-muted-foreground: #6B5953;
  --sangyu-border: #E8DDD5;
  --sangyu-input: #F5EBE0;
  --sangyu-ring: #7C2020;

  /* Non-prefixed semantic aliases */
  --background: #FBF5EF;
  --foreground: #2A1A15;
  --card: #FFFFFF;
  --card-foreground: #2A1A15;
  --popover: #FFFFFF;
  --popover-foreground: #2A1A15;
  --primary: #7C2020;
  --primary-foreground: #FBF5EF;
  --muted: #F5EBE0;
  --muted-foreground: #6B5953;
  --border: #E8DDD5;
  --input: #F5EBE0;
  --ring: #7C2020;

  /* Radius scale (restrained: 4/8/16/9999) */
  --sangyu-radius-small: 4px;
  --sangyu-radius-medium: 8px;
  --sangyu-radius-large: 16px;
  --sangyu-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows — 克制深度 */
  --sangyu-shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
  --shadow-1: 0 1px 2px rgba(61, 16, 16, 0.04), 0 1px 1px rgba(61, 16, 16, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(61, 16, 16, 0.12);
  --shadow-3: 0 24px 60px -20px rgba(61, 16, 16, 0.20);
}

/* ============================================================
   Dark Mode — 枫叶深红基底 (老人端、情感主导页)
   ============================================================ */
html.dark {
  --sangyu-background: #3D1010;
  --sangyu-foreground: #FBF5EF;
  --sangyu-card: #5C1A1A;
  --sangyu-card-foreground: #FBF5EF;
  --sangyu-popover: #5C1A1A;
  --sangyu-popover-foreground: #FBF5EF;
  --sangyu-primary: #C04545;
  --sangyu-primary-foreground: #FBF5EF;
  --sangyu-muted: #4A1515;
  --sangyu-muted-foreground: #D5C5B8;
  --sangyu-border: #6B2020;
  --sangyu-input: #4A1515;
  --sangyu-ring: #C04545;

  --background: #3D1010;
  --foreground: #FBF5EF;
  --card: #5C1A1A;
  --card-foreground: #FBF5EF;
  --popover: #5C1A1A;
  --popover-foreground: #FBF5EF;
  --primary: #C04545;
  --primary-foreground: #FBF5EF;
  --muted: #4A1515;
  --muted-foreground: #D5C5B8;
  --border: #6B2020;
  --input: #4A1515;
  --ring: #C04545;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --sangyu-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --sangyu-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --sangyu-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.20), 0 1px 1px rgba(0, 0, 0, 0.15);
  --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}

/* ============================================================
   Typography — 适老化大字体系
   ============================================================ */

body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0;
  color: var(--foreground);
  background-color: var(--background);
}

.text-display {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.text-h1 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: balance;
}

.text-h2 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.text-h3 {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 600;
}

.text-body-lg {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 400;
}

.text-caption {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--muted-foreground);
}

.text-numeric {
  font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}

    </style>

    <style type="text/tailwindcss">

    --color-foreground: var(--sangyu-foreground);
    --color-card: var(--sangyu-card);
    --color-card-foreground: var(--sangyu-card-foreground);
    --color-popover: var(--sangyu-popover);
    --color-popover-foreground: var(--sangyu-popover-foreground);

    --color-border: var(--sangyu-border);

    th { @apply whitespace-nowrap; }
  }

<body class="min-h-screen font-sans antialiased">
    <main class="bg-[var(--background)] min-h-screen">
      <style id="critical-layout">
        #health-page { background-color: #FBF5EF; }
        .metric-card { background-color:#FFFFFF; border-radius:16px; box-shadow:0 1px 2px rgba(61,16,16,.04); padding:20px; }
        .health-container { max-width:448px; margin:0 auto; padding:24px 16px 96px; }
        .nav-bar { background-color:#FFFFFF; border-top:1px solid #E8DDD5; }
        .metric-num { font-variant-numeric: tabular-nums; }
      </style>
      <div id="health-page" class="w-full max-w-md mx-auto px-4 pt-6 pb-24">

        <!-- 页面标题 -->
        <header class="mb-5">
          <h1 class="text-[24px] font-bold text-[var(--foreground)] leading-tight">健康数据</h1>
          <p class="text-[15px] text-[var(--muted-foreground)] mt-1">今日核心体征指标</p>
        </header>

        <!-- 心率指标卡片 -->
        <section id="heart-rate-card" class="metric-card bg-[var(--card)] rounded-[var(--radius-lg)] p-5 shadow-[var(--shadow-1)] mb-3">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[16px] text-[var(--muted-foreground)]">心率</span>
              <div class="flex items-baseline gap-1.5 mt-1">
                <span class="metric-num text-[36px] font-bold text-[var(--foreground)] leading-none" style="font-variant-numeric:tabular-nums">72</span>
                <span class="text-[15px] text-[var(--muted-foreground)]">bpm</span>
              </div>
            </div>
            <span class="inline-flex items-center gap-1 text-[15px] font-semibold px-2.5 py-1 rounded-[var(--radius-full)]" style="color:var(--state-success);background:rgba(45,122,61,0.10)">
              <span class="w-1.5 h-1.5 rounded-full" style="background:var(--state-success)"></span>正常
            </span>
          </div>
          <div class="mt-4">
            <svg viewBox="0 0 280 40" width="100%" height="40" preserveAspectRatio="none" class="block" aria-hidden="true">
              <polygon points="0,27 47,9 93,36 140,13 187,22 233,4 280,18 280,40 0,40" fill="rgba(124,32,32,0.08)"/>
              <polyline points="0,27 47,9 93,36 140,13 187,22 233,4 280,18" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            </svg>
            <div class="flex justify-between mt-1.5 text-[12px] text-[var(--muted-foreground)]">
              <span>7天前</span><span>今天</span>
            </div>
          </div>
        </section>

        <!-- 血压指标卡片 -->
        <section id="blood-pressure-card" class="metric-card bg-[var(--card)] rounded-[var(--radius-lg)] p-5 shadow-[var(--shadow-1)] mb-3">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[16px] text-[var(--muted-foreground)]">血压</span>
              <div class="flex items-baseline gap-1.5 mt-1">
                <span class="metric-num text-[36px] font-bold text-[var(--foreground)] leading-none" style="font-variant-numeric:tabular-nums">130/85</span>
                <span class="text-[15px] text-[var(--muted-foreground)]">mmHg</span>
              </div>
            </div>
            <span class="inline-flex items-center gap-1 text-[15px] font-semibold px-2.5 py-1 rounded-[var(--radius-full)]" style="color:var(--state-warning);background:rgba(184,134,11,0.12)">
              <span class="w-1.5 h-1.5 rounded-full" style="background:var(--state-warning)"></span>偏高
            </span>
          </div>
          <div class="mt-4">
            <svg viewBox="0 0 280 40" width="100%" height="40" preserveAspectRatio="none" class="block" aria-hidden="true">
              <polygon points="0,32 47,24 93,4 140,36 187,16 233,28 280,24 280,40 0,40" fill="rgba(124,32,32,0.08)"/>
              <polyline points="0,32 47,24 93,4 140,36 187,16 233,28 280,24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            </svg>
            <div class="flex justify-between mt-1.5 text-[12px] text-[var(--muted-foreground)]">
              <span>7天前</span><span>今天</span>
            </div>
          </div>
        </section>

        <!-- 血氧指标卡片 -->
        <section id="spo2-card" class="metric-card bg-[var(--card)] rounded-[var(--radius-lg)] p-5 shadow-[var(--shadow-1)] mb-3">
          <div class="flex items-start justify-between">
            <div>
              <span class="text-[16px] text-[var(--muted-foreground)]">血氧</span>
              <div class="flex items-baseline gap-1.5 mt-1">
                <span class="metric-num text-[36px] font-bold text-[var(--foreground)] leading-none" style="font-variant-numeric:tabular-nums">98</span>
                <span class="text-[15px] text-[var(--muted-foreground)]">%</span>
              </div>
            </div>
            <span class="inline-flex items-center gap-1 text-[15px] font-semibold px-2.5 py-1 rounded-[var(--radius-full)]" style="color:var(--state-success);background:rgba(45,122,61,0.10)">
              <span class="w-1.5 h-1.5 rounded-full" style="background:var(--state-success)"></span>正常
            </span>
          </div>
          <div class="mt-4">
            <svg viewBox="0 0 280 40" width="100%" height="40" preserveAspectRatio="none" class="block" aria-hidden="true">
              <polygon points="0,25 47,15 93,15 140,36 187,4 233,15 280,15 280,40 0,40" fill="rgba(124,32,32,0.08)"/>
              <polyline points="0,25 47,15 93,15 140,36 187,4 233,15 280,15" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
            </svg>
            <div class="flex justify-between mt-1.5 text-[12px] text-[var(--muted-foreground)]">
              <span>7天前</span><span>今天</span>
            </div>
          </div>
        </section>

        <!-- 数据来源标注 -->
        <p class="text-[15px] text-[var(--muted-foreground)] mt-3 mb-6 leading-relaxed">
          数据来源：智能手环 ｜ 更新时间：2分钟前
        </p>

        <!-- 异常时间线 -->
        <section class="mb-2">
          <h2 class="text-[22px] font-semibold text-[var(--foreground)] mb-3">近期异常</h2>
          <div class="bg-[var(--card)] rounded-[var(--radius-lg)] p-4 shadow-[var(--shadow-1)]">
            <ol class="space-y-0">
              <li class="flex items-start gap-3 py-3 border-b border-[var(--border)]">
                <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0" style="background:var(--state-warning)"></span>
                <div class="min-w-0">
                  <p class="text-[15px] text-[var(--foreground)] leading-snug">
                    <span class="text-[var(--muted-foreground)]" style="font-variant-numeric:tabular-nums">08-27 14:30</span>
                    <span class="mx-1">血压偏高</span>
                    <span style="font-variant-numeric:tabular-nums">135/88</span>
                  </p>
                </div>
              </li>
              <li class="flex items-start gap-3 py-3">
                <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0" style="background:var(--state-warning)"></span>
                <div class="min-w-0">
                  <p class="text-[15px] text-[var(--foreground)] leading-snug">
                    <span class="text-[var(--muted-foreground)]" style="font-variant-numeric:tabular-nums">08-26 09:15</span>
                    <span class="mx-1">心率偏低</span>
                    <span style="font-variant-numeric:tabular-nums">52bpm</span>
                  </p>
                </div>
              </li>
            </ol>
          </div>
        </section>

      </div>

      <!-- 底部导航 -->
      <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 z-40 h-[64px] bg-[var(--card)] border-t border-[var(--border)]" style="padding-bottom:env(safe-area-inset-bottom)">
